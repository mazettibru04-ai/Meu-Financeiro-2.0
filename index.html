<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Financeiro 2.0</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>💎 Meu Financeiro 2.0</h1>

  <!-- CÂMBIO -->
  <div class="card">
    <h3>💱 Câmbio</h3>
    <p id="cambio">Carregando...</p>
  </div>

  <!-- RESUMO -->
  <div class="card">
    <h3>📊 Resumo</h3>

    <p id="total-receitas">Receitas: €0</p>
    <p id="total-despesas">Despesas: €0</p>
    <p id="total-dividas">Dívidas: €0</p>

    <hr>

    <p id="saldo">Saldo: €0</p>
    <p id="saldo-real">Saldo real: €0</p>
  </div>

  <!-- GRÁFICOS -->
  <div class="card">
    <h3>📊 Dashboard</h3>
    <canvas id="graficoFinanceiro"></canvas>
  </div>

  <div class="card">
    <h3>📈 Receitas</h3>
    <canvas id="graficoReceitas"></canvas>
  </div>

  <div class="card">
    <h3>📉 Despesas</h3>
    <canvas id="graficoDespesas"></canvas>
  </div>

  <!-- RECEITAS -->
  <div class="card">
    <h3>➕ Receita</h3>
    <input id="r-desc" placeholder="Descrição">
    <select id="r-cat">
      <option>Trabalho</option>
      <option>Freelance</option>
      <option>Investimentos</option>
      <option>Outros</option>
    </select>
    <input id="r-val" type="number" placeholder="Valor">
    <select id="r-moeda">
      <option value="EUR">EUR</option>
      <option value="BRL">BRL</option>
    </select>
    <button onclick="addReceita()">Adicionar</button>
  </div>

  <div class="card">
    <h3>📋 Receitas</h3>
    <div id="lista-receitas"></div>
  </div>

  <!-- DESPESAS -->
  <div class="card">
    <h3>➖ Despesa</h3>
    <input id="d-desc" placeholder="Descrição">
    <select id="d-cat">
      <option>Alimentação</option>
      <option>Transporte</option>
      <option>Moradia</option>
      <option>Lazer</option>
      <option>Saúde</option>
      <option>Outros</option>
    </select>
    <input id="d-val" type="number" placeholder="Valor">
    <select id="d-moeda">
      <option value="EUR">EUR</option>
      <option value="BRL">BRL</option>
    </select>
    <button onclick="addDespesa()">Adicionar</button>
  </div>

  <div class="card">
    <h3>📋 Despesas</h3>
    <div id="lista-despesas"></div>
  </div>

  <!-- DÍVIDAS -->
  <div class="card">
    <h3>💳 Dívidas</h3>
    <input id="div-desc" placeholder="Descrição">
    <input id="div-valor" type="number" placeholder="Valor">
    <select id="div-moeda">
      <option value="EUR">EUR</option>
      <option value="BRL">BRL</option>
    </select>
    <button onclick="addDivida()">Adicionar</button>
  </div>

  <div class="card">
    <h3>📋 Lista de Dívidas</h3>
    <div id="lista-dividas"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
