<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meu Financeiro 2.0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>💰 Meu Financeiro 2.0</h1>
  <div class="card">
    <h3>💱 Câmbio atual</h3>
    <p id="cambio">Carregando...</p>
  </div>
<div class="card">
  <h3>📊 Resumo</h3>
  <p id="total-receitas">Receitas: €0</p>
  <p id="total-despesas">Despesas: €0</p>
  <p id="saldo">Saldo: €0</p>
</div>
  <div class="card">
    <h3>➕ Nova Receita</h3>
    <input id="r-desc" placeholder="Descrição">
    <input id="r-val" type="number" placeholder="Valor em €">
    <button onclick="addReceita()">Salvar</button>
  </div>
<div class="card">
  <h3>➖ Nova Despesa</h3>
  <input id="d-desc" placeholder="Descrição">
  <input id="d-val" type="number" placeholder="Valor em €">
  <button onclick="addDespesa()">Salvar</button>
</div>
<div class="card">
  <h3>📉 Despesas</h3>
  <div id="lista-despesas"></div>
</div>
<div class="card">
  <h3>💳 Nova Dívida</h3>
  <input id="div-desc" placeholder="Ex: Cartão Nubank">
  <input id="div-valor" type="number" placeholder="Valor em R$">
  <button onclick="addDivida()">Salvar</button>
</div>
<div class="card">
  <h3>📋 Suas Dívidas</h3>
  <div id="lista-dividas"></div>
</div>
  <div class="card">
    <h3>📊 Suas Receitas</h3>
    <div id="lista-receitas"></div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
