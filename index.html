<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Financeiro 2.0</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>💰 Meu Financeiro 2.0</h1>

  <!-- CÂMBIO -->
  <div class="card">
    <h3>💱 Câmbio atual</h3>
    <p id="cambio">Carregando...</p>
  </div>

  <!-- RESUMO -->
  <div class="card">
    <h3>📊 Resumo financeiro</h3>
    <p id="total-receitas">Receitas: €0</p>
    <p id="total-despesas">Despesas: €0</p>
    <p id="saldo">Saldo: €0</p>
  </div>

  <!-- ===================== -->
  <!-- RECEITAS -->
  <!-- ===================== -->
  <div class="card">
    <h3>➕ Nova Receita</h3>

    <input id="r-desc" placeholder="Descrição">
    <input id="r-val" type="number" placeholder="Valor">

    <!-- MOEDA -->
    <select id="r-moeda">
      <option value="EUR">Euro (€)</option>
      <option value="BRL">Real (R$)</option>
    </select>

    <button onclick="addReceita()">Salvar Receita</button>
  </div>

  <div class="card">
    <h3>📊 Lista de Receitas</h3>
    <div id="lista-receitas"></div>
  </div>

  <!-- ===================== -->
  <!-- DESPESAS -->
  <!-- ===================== -->
  <div class="card">
    <h3>➖ Nova Despesa</h3>

    <input id="d-desc" placeholder="Descrição">
    <input id="d-val" type="number" placeholder="Valor">

    <!-- MOEDA -->
    <select id="d-moeda">
      <option value="EUR">Euro (€)</option>
      <option value="BRL">Real (R$)</option>
    </select>

    <button onclick="addDespesa()">Salvar Despesa</button>
  </div>

  <div class="card">
    <h3>📉 Lista de Despesas</h3>
    <div id="lista-despesas"></div>
  </div>

  <!-- ===================== -->
  <!-- DÍVIDAS -->
  <!-- ===================== -->
  <div class="card">
    <h3>💳 Nova Dívida</h3>

    <input id="div-desc" placeholder="Ex: Cartão Nubank">
    <input id="div-valor" type="number" placeholder="Valor">

    <!-- MOEDA -->
    <select id="div-moeda">
      <option value="EUR">Euro (€)</option>
      <option value="BRL">Real (R$)</option>
    </select>

    <button onclick="addDivida()">Salvar Dívida</button>
  </div>

  <div class="card">
    <h3>📋 Suas Dívidas</h3>
    <div id="lista-dividas"></div>
  </div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
